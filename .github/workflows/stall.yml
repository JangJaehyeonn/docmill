name: Stall check

# Claude PR이 오래 움직이지 않으면(자동 수정이 안 뜨거나 승인이 안 나는 경우) 사람에게 알린다.
# 멘션은 GitHub 알림(폰 앱 포함)으로 간다.
# 먼저, CI는 다 통과했고 남은 건 답글까지 달린 CodeRabbit 스레드의 해결 처리뿐인 PR을 찾아
# 30분이 지나면 바로 알린다 (스레드 링크와 함께, 커밋마다 한 번). 90분 정체 알림보다 빨리 풀 수 있다.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STALL_MINUTES: "90"
      RESOLVE_MINUTES: "30"
    steps:
      - name: 스레드 해결만 남은 PR 알리기
        run: |
          set -euo pipefail
          owner=${REPO%/*}; name=${REPO#*/}
          now=$(date -u +%s)
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,headRefOid,reviewDecision,labels \
            --jq '.[] | select(.headRefName | startswith("claude/"))
                  | select([.labels[].name] | index("needs-human") | not)
                  | select(.reviewDecision != "APPROVED")
                  | "\(.number) \(.headRefOid)"' |
          while read -r n sha; do
            # 이 커밋에 이미 알렸으면 건너뛴다.
            if gh api "repos/$REPO/issues/$n/comments?per_page=100" --jq '.[].body' \
                | grep -q "docmill-resolve:$sha"; then continue; fi
            # 마지막 커밋 뒤로 RESOLVE_MINUTES가 지났는지.
            committed=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.committer.date')
            age=$(( (now - $(date -u -d "$committed" +%s)) / 60 ))
            [ "$age" -ge "$RESOLVE_MINUTES" ] || continue
            # CI가 모두 끝났고 실패가 없는지 (건너뜀·중립·취소된 이전 실행은 무시).
            bad=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq \
              '[.check_runs[] | select(.status != "completed" or
                 (.conclusion as $c | ["success","skipped","neutral","cancelled"] | index($c) | not))] | length')
            [ "$bad" = "0" ] || continue
            # 열린 CodeRabbit 스레드가 있고, 모두 답글(반영 설명)이 달렸는지.
            threads=$(gh api graphql -f owner="$owner" -f name="$name" -F n="$n" -f query='
              query($owner:String!,$name:String!,$n:Int!){repository(owner:$owner,name:$name){
                pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved
                  comments(first:20){totalCount nodes{author{login} url}}}}}}}' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                     | select(.isResolved | not)
                     | select(.comments.nodes[0].author.login | startswith("coderabbitai"))]')
            open=$(printf '%s' "$threads" | jq 'length')
            unanswered=$(printf '%s' "$threads" | jq '[.[] | select(.comments.totalCount < 2)] | length')
            [ "$open" -gt 0 ] && [ "$unanswered" = "0" ] || continue
            links=$(printf '%s' "$threads" | jq -r '.[] | "- " + .comments.nodes[0].url')
            echo "PR #$n: 해결 처리만 남은 스레드 $open개"
            gh pr comment "$n" --repo "$REPO" --body "<!-- docmill-resolve:$sha -->
          @JangJaehyeonn CI는 모두 통과했고, CodeRabbit 스레드 ${open}개에 반영 답글이 달려 있는데 해결 처리가 안 돼 승인이 막혀 있습니다.
          아래 스레드를 확인하고 \"Resolve conversation\"을 누르면 CodeRabbit 승인 후 자동 머지됩니다.
          ${links}" || echo "::warning::PR #$n 알림 실패"
          done

      - name: 멈춘 Claude PR 찾기
        run: |
          set -euo pipefail
          gh label create needs-human --repo "$REPO" --color b60205 \
            --description "에이전트가 해결하지 못해 사람 확인이 필요함" 2>/dev/null || true
          now=$(date -u +%s)
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefName,updatedAt,labels \
            --jq '.[] | select(.headRefName | startswith("claude/"))
                  | select([.labels[].name] | index("needs-human") | not)
                  | "\(.number) \(.updatedAt)"' |
          while read -r n ts; do
            age=$(( (now - $(date -u -d "$ts" +%s)) / 60 ))
            if [ "$age" -ge "$STALL_MINUTES" ]; then
              echo "PR #$n: ${age}분째 변화 없음"
              # 마지막 댓글이 이미 정체 알림이면 댓글은 건너뛰고 라벨만 다시 시도한다 (중복 알림 방지).
              last=$(gh api --paginate "repos/$REPO/issues/$n/comments?per_page=100" --jq '.[] | .body | @json' \
                | tail -n 1 | jq -r '. // ""')
              if ! printf '%s' "$last" | grep -q 'docmill-stall'; then
                gh pr comment "$n" --repo "$REPO" --body "<!-- docmill-stall -->
          @JangJaehyeonn 이 PR이 ${age}분 동안 변화가 없어 멈춘 것으로 보입니다 (CI·리뷰·자동 수정 모두 대기). 확인이 필요합니다." || continue
              fi
              gh pr edit "$n" --repo "$REPO" --add-label needs-human || echo "::warning::PR #$n 라벨 추가 실패"
            fi
          done
