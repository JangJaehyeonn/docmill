[[requirement]]
id = "FR-23"
title = "도구 선택 평가 세트"
area = "평가"
priority = "필수"
phase = 5
model = "opus"
detail = "`evals/scenarios/`에 사용자 요청 문장과 기대 결과(호출할 도구와 핵심 인자, 또는 도구 없음)를 담은 시나리오를 둔다. `docmill eval --model claude-code --date YYYY-MM-DD`가 docmill MCP 서버를 연결한 모델에 시나리오를 보내고, 도구 선택·인자 정확도를 채점해 `evals/reports/<날짜>.md`와 `.json`으로 남긴다. 모델 호출은 Claude Code CLI(구독 인증)로만 하고 Anthropic API 키는 쓰지 않는다. 테스트와 CI는 가짜 모델로 채점 로직만 검증한다. 도구 설명을 바꿨을 때 정확도가 어떻게 달라지는지 비교하는 것이 목적이다."
depends = ["FR-05", "FR-06", "FR-07", "FR-08", "FR-09", "FR-10"]
acceptance = [
