name: CI

on:
  pull_request:
    # edited: PR 제목(FR-xx)을 고치면 인수 테스트 대상이 바뀌므로 다시 돈다.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성 설치
        run: uv sync --locked
      - name: 린트
        run: uv run ruff check .
      - name: 포맷
        run: uv run ruff format --check .
      - name: 타입 검사
        run: uv run mypy
      - name: 단위 테스트
        run: uv run pytest -q tests/unit
      - name: 인수 테스트 대상 계산 (완료된 요구사항 + 이 PR의 요구사항)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/active_frs.py "$PR_TITLE" >> "$GITHUB_ENV"
      - name: 인수 테스트
        run: |
          if ! find tests/acceptance -name 'test_*.py' | grep -q .; then
            echo "::notice::아직 승인된 인수 테스트가 없습니다 (Phase 시작 전)."
            exit 0
          fi
          echo "실행 대상 요구사항: ${DOCMILL_ACTIVE_FRS:-없음}"
          uv run pytest -q tests/acceptance

  guard:
    name: protected-paths
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 제목에 요구사항 ID 필수
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq 'FR-[0-9]{2}'; then
            echo "::error::PR 제목에 요구사항 ID(FR-xx)가 없습니다. 인수 테스트 대상이 정해지지 않습니다."
            exit 1
          fi
      - name: 보호 경로 수정 금지
        run: |
          # -z: 한글 등 비ASCII 경로도 따옴표·이스케이프 없이 실제 경로로 검사한다.
          git diff --name-only --no-renames -z "origin/${BASE_REF}...HEAD" | python3 -c '
          import re, sys
          protected = re.compile(
              r"^(tests/acceptance/|scripts/|\.github/|\.claude/|docs/requirements/"
              r"|CLAUDE\.md$|\.coderabbit\.yaml$|ruff\.toml$|mypy\.ini$|pytest\.ini$)"
          )
          paths = [p for p in sys.stdin.buffer.read().decode("utf-8", "surrogateescape").split("\0") if p]
          print("\n".join(paths))
          bad = [p for p in paths if protected.match(p)]
          for p in bad:
              print(f"::error file={p}::Claude 브랜치에서 보호 경로를 수정했습니다. 구현을 고치세요.")
          sys.exit(1 if bad else 0)
          '
      - name: 테스트 건너뛰기 추가 금지
        run: |
          if git diff "origin/${BASE_REF}...HEAD" -- tests | grep -E '^\+.*(pytest\.mark\.(skip|xfail)|pytest\.skip\(|pytest\.xfail\()'; then
            echo "::error::테스트에 skip/xfail을 추가했습니다. 구현을 고치세요."
            exit 1
          fi
