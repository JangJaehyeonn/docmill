[project]
name = "docmill"
version = "0.0.1"
description = "엑셀·PPT·워드 작업을 AI 채팅에서 처리하고, 성공한 작업을 레시피로 저장해 AI 없이 반복 실행하는 MCP 서버"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "JangJaehyeonn" }]
keywords = ["mcp", "excel", "powerpoint", "word", "automation", "recipe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.12",
]

[project.scripts]
docmill = "docmill.cli:app"

[project.urls]
Repository = "https://github.com/JangJaehyeonn/docmill"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmill"]
