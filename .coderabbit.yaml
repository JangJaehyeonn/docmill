# CodeRabbit 리뷰 설정
language: "ko-KR"
tone_instructions: "간결하고 구체적으로. 문제, 근거, 고칠 방법을 한 번에 적는다."
reviews:
  # assertive는 라운드마다 범위 밖 강화 제안을 새로 내서 승인이 계속 미뤄졌다 (FR-05 PR #40, 10커밋).
  profile: "chill"
  # 지적이 모두 해결되면 CodeRabbit이 PR을 승인한다.
  # main 규칙의 '승인 1개 필수'가 이 승인을 요구하므로, 지적이 남은 PR은 머지되지 않는다.
  auto_approvals:
    enabled: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 커밋이 연달아 올라와도 자동 리뷰를 멈추지 않는다. 멈추면 승인이 나지 않아 자동 머지가 막힌다.
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!uv.lock"
  path_instructions:
    - path: "**/*"
      instructions: |
        이 PR은 Claude Code가 이슈 하나를 구현한 것이다. 다음을 확인한다.
        - 변경 요청(승인 보류)은 인수 기준 미충족, 실제 버그, 실제로 악용 가능한 보안 결함에만 한다.
          이 이슈 범위를 벗어나는 강화·리팩터링 제안은 "후속 제안"으로만 남기고 승인을 막지 않는다.
        - 이미 지적한 문제가 반영됐으면 같은 주제로 새 지적을 이어 붙이지 말고 스레드를 해결 처리한다.
          새 커밋이 올라오면 열린 스레드마다 반영 여부를 확인하고, 반영됐으면 해결 처리한다.
          스레드에 claude[bot]의 "반영했습니다" 답글이 있으면 그 커밋을 확인해 판단한다.
          남은 변경 요청 사유가 없으면 이전 변경 요청을 유지하지 말고 승인한다.
        - PR 본문의 `Closes #N` 이슈에 적힌 인수 기준을 모두 충족했는가. 빠진 항목은 변경 요청한다.
        - 요구사항에 없는 기능을 추가하지 않았는가.
        - 새 의존성(pyproject.toml 변경)이나 구조 결정이 있는데 `docs/adr/` 문서가 없으면 변경 요청한다.
    - path: "tests/acceptance/**"
      instructions: |
        보호 폴더다. Claude 브랜치(claude/*)에서 이 경로를 수정했다면 무조건 변경 요청한다.
        acceptance/* 브랜치라면 테스트가 구현 방식이 아니라 사용자에게 보이는 결과를 검증하는지 본다.
    - path: "tests/**"
      instructions: |
        skip, xfail, 기대값 완화처럼 테스트를 약하게 만드는 변경이 있으면 변경 요청한다.
    - path: "src/docmill/**"
      instructions: |
        - MCP로 노출하는 도구는 업무 단위 도구뿐이어야 한다. 목록은 docs/requirements/issues.toml의 요구사항이 정한다
          (처음 6개 + 요구사항에 "도구 `이름`"으로 적힌 것). 엔진의 저수준 도구를 직접 노출하면 지적한다.
        - 엔진 호출은 DocumentTool 인터페이스를 거쳐야 한다.
        - 엔진 실패가 서버 예외로 번지지 않고 도구 결과로 반환되는지 본다.
        - 모든 도구 호출이 실행 ID와 함께 로그에 남는지 본다.
        - 파일 작업이 작업별 임시 폴더 안에서만 이뤄지는지, 엔진 프로세스에 시간 제한이 있는지 본다.
    - path: "src/docmill/recipe/**"
      instructions: |
        재현성이 핵심이다. 현재 시각, 난수, 정렬되지 않은 dict·set 순회, 실행 환경에 따른 경로처럼
        같은 입력에서 다른 결과를 만들 수 있는 코드를 반드시 지적한다.
        레시피는 엔진 명령이 아니라 docmill 도구 호출과 인자를 저장해야 한다.
chat:
  auto_reply: true
