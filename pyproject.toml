[project]
name = "docmill"
version = "0.0.1"
description = "엑셀·PPT·워드 작업을 AI 채팅에서 처리하고, 성공한 작업을 레시피로 저장해 AI 없이 반복 실행하는 MCP 서버"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "JangJaehyeonn" }]
keywords = ["mcp", "excel", "powerpoint", "word", "automation", "recipe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.12",
]

[project.scripts]
docmill = "docmill.cli:app"

[project.urls]
Repository = "https://github.com/JangJaehyeonn/docmill"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmill"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "acceptance: 요구사항 인수 기준 테스트 (tests/acceptance, 사람 승인으로만 변경)",
    "engine: 실제 문서 엔진 바이너리가 필요한 테스트",
    "fr(id): 이 테스트가 검증하는 요구사항 ID (예: FR-05)",
]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
