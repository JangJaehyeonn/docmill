# docmill 요구사항 (요구사항 정의서 v2 기준)
# scripts/create_issues.py가 이 파일로 GitHub 이슈를 만든다.
# 이 파일은 보호 경로다. 수정은 사람 승인 PR로만 한다.

[[requirement]]
id = "FR-01"
title = "MCP 서버 실행"
area = "서버"
priority = "필수"
phase = 1
detail = "`docmill mcp` 명령으로 stdio MCP 서버를 실행하고, AI 앱에 docmill 도구를 노출한다. 업무 도구가 추가될 때마다 같은 서버에 등록되는 구조로 만든다."
depends = []
acceptance = [
  "`docmill mcp`로 서버가 실행되고 MCP 클라이언트에서 도구 목록을 조회할 수 있다",
  "도구 목록에 엔진의 저수준 도구가 노출되지 않는다",
  "Claude 데스크톱·Claude Code 연결 방법이 README에 있다",
]

[[requirement]]
id = "FR-02"
title = "문서 엔진 연동"
area = "서버"
priority = "필수"
phase = 1
detail = "GridCraft·DeckCraft·WordCraft의 헤드리스 MCP 서버를 내부 MCP 클라이언트로 실행·호출한다. 엔진 실행 파일 경로는 설정(환경 변수 또는 설정 파일)으로 지정한다."
depends = ["FR-01"]
acceptance = [
  "세 엔진 각각에 대해 내부 클라이언트가 도구 목록을 가져오고 도구 하나를 호출할 수 있다",
  "엔진 실행 파일이 없으면 어떤 엔진이 없는지 알려주는 오류를 반환한다 (서버는 죽지 않음)",
  "엔진 프로세스에 시간 제한(기본 60초)이 있고 초과 시 종료된다",
]

[[requirement]]
id = "FR-03"
title = "공통 엔진 어댑터"
area = "서버"
priority = "필수"
phase = 1
detail = "세 엔진을 `DocumentTool` 인터페이스(open · execute · save · render)로 감싼다. 모든 파일 작업은 작업별 임시 폴더 안에서 한다."
depends = ["FR-02"]
acceptance = [
  "GridCraft·DeckCraft·WordCraft 어댑터가 모두 DocumentTool을 구현한다",
  "확장자(.xlsx·.pptx·.docx)로 알맞은 어댑터를 고르는 함수가 있다",
  "작업이 끝나면 임시 폴더가 정리된다",
]

[[requirement]]
id = "FR-04"
title = "엔진 설치 명령"
area = "서버"
priority = "권장"
phase = 4
detail = "`docmill setup`이 고정된 버전의 엔진 실행 파일을 내려받아 설치하고 버전을 확인한다."
depends = ["FR-02"]
acceptance = [
  "`docmill setup` 실행 후 세 엔진의 버전이 출력된다",
  "이미 설치되어 있으면 다시 받지 않는다",
]

[[requirement]]
id = "FR-05"
title = "excel_to_report_ppt 업무 도구"
area = "업무 도구"
priority = "필수"
phase = 2
detail = "엑셀 데이터에서 지정 열 기준 합계·비중을 계산하고, 슬라이드 N장(표지·요약·그래프·상세·마무리)과 그래프를 넣은 pptx를 만든다. 입력: input, group_by, value, slides(기본 5), chart(bar·line·pie), template(선택), verify(기본 true)."
depends = ["FR-03", "FR-16"]
acceptance = [
  "고정 샘플 엑셀로 실행하면 슬라이드 수가 slides 값과 같은 pptx가 생성된다",
  "그래프 슬라이드의 값이 엑셀의 group_by별 value 합계와 같다",
  "verify=true면 숫자 검증 결과(대조 개수·일치 개수)가 도구 결과에 포함된다",
  "group_by나 value 열이 없으면 빠진 열 이름을 알려주는 오류를 반환한다",
  "결과에 파일 경로·요약·실행 ID가 포함된다",
]

[[requirement]]
id = "FR-06"
title = "doc_to_task_table 업무 도구"
area = "업무 도구"
priority = "필수"
phase = 2
detail = "워드 문서에서 할 일·담당자·마감일을 추출해 마감일 순 xlsx로 저장한다. 담당자나 마감일이 없는 항목은 제외 목록과 이유로 돌려준다."
depends = ["FR-03", "FR-16"]
acceptance = [
  "고정 샘플 회의록에서 할 일 4개가 할 일·담당자·마감일·상태 열로 저장된다",
  "행이 마감일 순으로 정렬된다",
  "담당자·마감일이 없는 항목은 결과의 제외 목록에 이유와 함께 들어간다",
]

[[requirement]]
id = "FR-07"
title = "apply_template 업무 도구"
area = "업무 도구"
priority = "필수"
phase = 2
detail = "등록된 양식 규칙(제목 크기·색·정렬·글꼴)을 PPT·워드 전체에 적용한다. 본문 내용은 바꾸지 않는다."
depends = ["FR-03", "FR-16"]
acceptance = [
  "고정 샘플 PPT의 모든 슬라이드 제목 크기·색·정렬이 양식 값과 같아진다",
  "본문 텍스트는 적용 전후 동일하다",
  "결과에 수정한 페이지 수와 적용 규칙 목록이 포함된다",
]

[[requirement]]
id = "FR-08"
title = "verify_numbers 업무 도구"
area = "업무 도구"
priority = "필수"
phase = 2
detail = "결과 문서의 숫자를 원본 엑셀에서 다시 계산해 대조하고, 대조 개수·일치 개수·불일치 위치와 값을 돌려준다."
depends = ["FR-03"]
acceptance = [
  "올바른 결과 문서는 모든 숫자가 일치로 판정된다",
  "숫자 하나를 틀리게 만든 문서는 불일치로 판정되고 위치와 기대값이 보고된다",
]

[[requirement]]
id = "FR-09"
title = "save_recipe 레시피 저장"
area = "레시피"
priority = "필수"
phase = 3
detail = "같은 세션에서 성공한 docmill 도구 호출과 인자를 이름 붙여 레시피로 저장한다. 입력 파일 경로는 `$변수`로 바꾼다. 엔진 명령이 아니라 docmill 도구 호출을 저장한다."
depends = ["FR-05", "FR-16"]
acceptance = [
  "excel_to_report_ppt 실행 후 save_recipe를 호출하면 레시피가 저장되고 단계 목록이 반환된다",
  "저장된 레시피에 원래 입력 파일 경로 대신 입력 변수가 들어 있다",
  "실패한 실행은 레시피에 포함되지 않는다",
]

[[requirement]]
id = "FR-10"
title = "run_recipe 레시피 실행"
area = "레시피"
priority = "필수"
phase = 3
detail = "저장된 레시피를 새 입력 파일로 순서대로 실행한다. AI를 호출하지 않는다."
depends = ["FR-09"]
acceptance = [
  "다른 주 샘플 엑셀로 실행하면 같은 형식의 pptx가 생성되고 숫자는 새 파일 기준이다",
  "같은 입력으로 10번 실행하면 결과 내용과 서식이 10번 모두 같다",
  "실행 로그의 AI 사용 여부가 '사용 안 함'으로 기록된다",
]

[[requirement]]
id = "FR-11"
title = "레시피 실행 전 점검"
area = "레시피"
priority = "필수"
phase = 3
detail = "입력 파일에 레시피가 쓰는 열·시트가 없으면 실행 전에 중단하고 빠진 항목을 알린다."
depends = ["FR-10"]
acceptance = [
  "필요한 열이 없는 파일을 넣으면 아무 파일도 만들지 않고 빠진 열 이름을 반환한다",
]

[[requirement]]
id = "FR-12"
title = "레시피 자동 검증"
area = "레시피"
priority = "필수"
phase = 3
detail = "레시피 실행마다 숫자 검증을 수행하고, 실패하면 결과 파일을 출력 폴더에 쓰지 않고 실패로 기록한다."
depends = ["FR-10", "FR-08"]
acceptance = [
  "검증이 실패하도록 조작한 경우 출력 폴더에 결과 파일이 생기지 않는다",
  "실패가 실행 로그에 원인과 함께 기록된다",
]

[[requirement]]
id = "FR-13"
title = "레시피 관리 명령"
area = "레시피"
priority = "권장"
phase = 3
detail = "CLI로 레시피 목록 보기·이름 변경·삭제를 한다."
depends = ["FR-09"]
acceptance = [
  "`docmill recipes` 목록에 저장된 레시피가 나온다",
  "이름 변경과 삭제 후 목록에 반영된다",
]

[[requirement]]
id = "FR-14"
title = "docmill run CLI"
area = "CLI"
priority = "필수"
phase = 3
detail = "`docmill run <레시피> --input <파일> [--out <폴더>]`로 AI 없이 레시피를 실행한다. 예약 작업(cron, 작업 스케줄러)에서 호출할 수 있어야 한다. 성공 0, 실패 1 이상의 종료 코드를 돌려준다."
depends = ["FR-10"]
acceptance = [
  "명령 한 줄로 레시피가 실행되고 결과 파일 경로가 출력된다",
  "실패 시 0이 아닌 종료 코드와 원인이 출력된다",
  "10초 이내에 끝난다 (고정 샘플 기준)",
]

[[requirement]]
id = "FR-15"
title = "실행 결과 전달"
area = "CLI"
priority = "권장"
phase = 3
detail = "실행이 끝나면 지정 폴더에 저장하고, 웹훅 URL이 설정되어 있으면 결과 요약을 보낸다."
depends = ["FR-14"]
acceptance = [
  "웹훅 URL이 설정되면 실행 후 요약이 전송된다 (테스트에서는 가짜 서버로 확인)",
  "웹훅 전송 실패가 실행 결과를 실패로 만들지 않는다",
]

[[requirement]]
id = "FR-16"
title = "실행 로그"
area = "로그"
priority = "필수"
phase = 1
detail = "모든 도구 호출(도구명·인자 요약·결과·소요 시간·AI 사용 여부)을 실행 ID와 함께 SQLite에 기록한다."
depends = ["FR-01"]
acceptance = [
  "도구를 호출할 때마다 실행 ID가 발급되고 로그에 한 줄이 남는다",
  "실행 ID로 해당 호출의 기록을 조회할 수 있다",
  "인자 요약에 파일 내용 같은 큰 데이터나 비밀값이 들어가지 않는다",
]

[[requirement]]
id = "FR-17"
title = "실행 기록 조회"
area = "로그"
priority = "권장"
phase = 3
detail = "`docmill history <레시피>`로 실행 기록을 표로 보여준다."
depends = ["FR-16", "FR-10"]
acceptance = [
  "레시피 실행 기록이 시간·소요 시간·AI 사용 여부·검증 결과와 함께 표로 출력된다",
]

[[requirement]]
id = "FR-18"
title = "양식 등록"
area = "양식"
priority = "권장"
phase = 2
detail = "회사 양식 PPT·워드에서 스타일 규칙(제목 크기·색·정렬·글꼴)을 추출해 이름 붙여 저장한다."
depends = ["FR-07"]
acceptance = [
  "샘플 양식 PPT에서 규칙을 추출해 저장하면 apply_template에서 그 이름으로 쓸 수 있다",
]

[[requirement]]
id = "FR-19"
title = "원격 MCP 모드"
area = "연결"
priority = "선택"
phase = 4
detail = "`docmill mcp --http`로 HTTP MCP 서버를 실행한다. 파일은 업로드 URL로 받는다."
depends = ["FR-01"]
acceptance = [
  "HTTP 모드로 실행하면 원격 MCP 클라이언트가 도구 목록을 조회할 수 있다",
]

[[requirement]]
id = "FR-20"
title = "결과 미리보기 이미지"
area = "미리보기"
priority = "선택"
phase = 4
detail = "결과 PPT·워드의 첫 페이지를 PNG로 만들어 도구 결과에 함께 반환한다."
depends = ["FR-03"]
acceptance = [
  "excel_to_report_ppt 결과에 첫 슬라이드 PNG 경로가 포함된다",
]
