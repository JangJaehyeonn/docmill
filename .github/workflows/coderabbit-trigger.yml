name: CodeRabbit review trigger

# CodeRabbit 무료(오픈소스) 플랜은 별 10개 미만 공개 저장소에서 자동 리뷰를 하지 않는다.
# 체험판이 끝나면(2026-11-25) 저장소 변수 CODERABBIT_MANUAL_TRIGGER=true를 설정해,
# Claude PR이 열리거나 새 커밋이 올라올 때마다 리뷰를 요청한다.
# 체험 중에는 자동 리뷰와 겹쳐 시간당 리뷰 한도를 쓰므로 꺼 둔다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  request:
    if: >-
      vars.CODERABBIT_MANUAL_TRIGGER == 'true' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: CodeRabbit 리뷰 요청
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$REPO" --body "@coderabbitai review"
