name: spike onlyoffice
on:
  push:
    branches: [spike/onlyoffice]
permissions:
  contents: read
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: ONLYOFFICE 띄우기
        run: |
          docker run -d --name oo --network host -e JWT_ENABLED=false -e ALLOW_PRIVATE_IP_ADDRESS=true onlyoffice/documentserver:8.3
          for i in $(seq 90); do curl -sf http://localhost/healthcheck && break; sleep 5; done
          echo; docker logs oo 2>&1 | tail -5
      - name: 파일 서버
        working-directory: spike/onlyoffice
        run: |
          cat > srv.py <<'PY'
          import http.server
          class H(http.server.SimpleHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0)); self.rfile.read(n)
                  self.send_response(200); self.send_header('Content-Type','application/json'); self.end_headers(); self.wfile.write(b'{"error":0}')
          http.server.ThreadingHTTPServer(('0.0.0.0', 8000), H).serve_forever()
          PY
          nohup python3 srv.py > srv.log 2>&1 &
          sleep 1; curl -sI http://localhost:8000/sales_q3.xlsx | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 브라우저로 열기
        working-directory: spike/onlyoffice
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node run.cjs
          docker exec oo bash -c 'tail -20 /var/log/onlyoffice/documentserver/converter/out.log /var/log/onlyoffice/documentserver/docservice/out.log' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oo-screenshot
          path: spike/onlyoffice/oo.png
