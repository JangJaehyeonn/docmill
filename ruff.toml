# Protected file (CODEOWNERS): do not weaken these checks.
# Keep this file ASCII-only: Windows Python reads .ini files with the system codepage (cp949).
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
"scripts/*" = ["E501"]
