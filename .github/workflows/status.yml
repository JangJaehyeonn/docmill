name: Status board

# 진행 현황판 이슈(status-board 라벨)를 갱신한다.
# 이슈·PR 상태가 바뀔 때마다, 그리고 놓친 경우를 위해 1시간마다 다시 만든다.
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: status-board
  cancel-in-progress: true

jobs:
  update:
    # 현황판 이슈 자신을 고칠 때 생기는 이벤트로 다시 도는 것을 막는다.
    if: >-
      github.event_name != 'issues' ||
      !contains(join(github.event.issue.labels.*.name, ','), 'status-board')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            docs/requirements
      - name: 현황판 갱신 (+ 노션 페이지, 설정돼 있으면)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
        run: python3 scripts/status_board.py --notion
