name: Fix merge conflicts

# main이 바뀌면 열려 있는 Claude PR 중 충돌난 것을 Claude가 main을 병합해 해결한다. 최대 3회, 넘으면 needs-human.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - name: 충돌난 Claude PR 찾기
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/find_conflict.py >> "$GITHUB_OUTPUT"

  fix:
    needs: find
    if: needs.find.outputs.branch != ''
    concurrency:
      group: claude-fix-${{ needs.find.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find.outputs.branch }}
          fetch-depth: 0
      # 시도 횟수 스크립트와 엔진 설치 액션은 수정 대상 브랜치가 아니라 이 워크플로 리비전(main)의 것을 쓴다.
      # 브랜치에서 바뀐 스크립트가 쓰기 권한으로 실행되지 않게 하고, 오래된 브랜치에도 동작하게 한다.
      - uses: actions/checkout@v4
        with:
          # pull_request_review의 github.sha는 PR 병합 커밋이라 기본 브랜치를 직접 지정한다.
          ref: ${{ github.event.repository.default_branch }}
          path: .pipeline
          sparse-checkout: |
            .github/actions
            scripts
      - name: 시도 횟수 확인
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.find.outputs.pr }}
        run: python3 .pipeline/scripts/fix_attempt.py "$PR" conflict >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.attempt.outputs.proceed == 'true'
        with:
          enable-cache: true
      - uses: ./.pipeline/.github/actions/setup-engines
        if: steps.attempt.outputs.proceed == 'true'
      - name: 설치 액션 사본 정리 (커밋에 섞이지 않게)
        if: steps.attempt.outputs.proceed == 'true'
        run: rm -rf .pipeline
      - if: steps.attempt.outputs.proceed == 'true'
        run: uv sync
      - uses: anthropics/claude-code-action@v1
        if: steps.attempt.outputs.proceed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 리뷰·CI·머지 이벤트는 봇(CodeRabbit, Claude 앱, Actions)이 일으키므로 허용한다.
          # 포크 PR은 위 job 조건에서 이미 막고, 대상은 이 저장소의 claude/* 브랜치뿐이다.
          allowed_bots: "coderabbitai,claude,github-actions"
          # Claude 앱이 연 PR은 작성자 권한을 확인할 수 없어 명령 실행이 막히므로 끈다 (같은 이유로 안전).
          restrict_untrusted_prs: "false"
          prompt: |
            PR #${{ needs.find.outputs.pr }} (브랜치 ${{ needs.find.outputs.branch }})가 main과 충돌합니다.
            1. `git fetch origin main`과 `git merge origin/main`으로 병합하고 충돌을 해결하세요. 양쪽 변경의 의도를 모두 살리세요.
            2. rebase나 강제 푸시는 하지 마세요.
            3. 품질 검사를 모두 통과시킨 뒤 `git push origin ${{ needs.find.outputs.branch }}`로 푸시하세요.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(uv sync:*),Bash(uv run ruff:*),Bash(uv run mypy:*),Bash(uv run pytest:*),Bash(uv run python scripts/check.py),Bash(DOCMILL_ACTIVE_FRS=*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch origin main),Bash(git merge origin/main:*),Bash(git push origin ${{ needs.find.outputs.branch }}),Bash(gh pr view:*),Bash(uv run python:*),Bash(python3:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(find:*),Bash(which:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(touch:*),Bash(gridcraft-cli:*),Bash(deckcraft-cli:*),Bash(wordcraft-cli:*),Bash(gh issue list:*)"
