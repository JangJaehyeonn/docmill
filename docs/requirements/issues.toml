  "가짜 모델에 정답·오답 응답을 정해 주고 실행하면 도구 일치율과 인자 일치율이 시나리오별·도구별로 기대값과 같게 계산된다",
  "`docmill eval --compare <이전.json> <새.json>`이 도구별 정확도 변화 표를 출력한다",
  "API 키 환경 변수(ANTHROPIC_API_KEY 등) 없이 동작하고, 설정돼 있어도 쓰지 않는다",
  "보고서의 날짜는 인자로 받으며, 같은 응답이면 보고서가 바이트 단위로 같다",
]

[[requirement]]
