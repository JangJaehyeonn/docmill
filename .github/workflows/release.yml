name: Release

# main에 머지될 때마다 release-please가 릴리스 PR(버전·변경 기록)을 관리한다.
# 릴리스 PR이 머지되면 `release` 환경에서 재현의 승인을 기다린 뒤 PyPI와 GHCR에 배포한다.
# 쓰기 권한을 가진 잡이므로 외부 액션은 커밋 SHA로 고정한다 (Dependabot이 갱신).
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4
        id: rp
        with:
          release-type: python
      # release-please는 pyproject.toml 버전만 올리므로 uv.lock을 맞춰야 `uv sync --locked`가 통과한다.
      - uses: actions/checkout@v4
        if: steps.rp.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
      - uses: astral-sh/setup-uv@v6
        if: steps.rp.outputs.prs_created == 'true'
      - name: 릴리스 PR의 uv.lock 갱신
        if: steps.rp.outputs.prs_created == 'true'
        env:
          HEAD: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: uv.lock 버전 동기화"
          git push origin "HEAD:$HEAD"
      - name: 릴리스 PR에 CI 실행
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          REPO: ${{ github.repository }}
        run: gh workflow run CI --repo "$REPO" --ref "$HEAD"

  pypi:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - name: 패키지 빌드
        run: uv build
      - name: PyPI 배포 (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  docker:
    needs: [release-please, pypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker 이미지 배포
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jangjaehyeonn/docmill:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/jangjaehyeonn/docmill:latest
