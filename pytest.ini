# Protected file (CODEOWNERS): do not narrow the test scope.
# Keep this file ASCII-only: Windows Python reads .ini files with the system codepage (cp949).
[pytest]
testpaths = tests
addopts = -ra
markers =
    engine: needs the real document engine binaries
    fr(id): requirement ID this test verifies (e.g. FR-05); required on every test in tests/acceptance
