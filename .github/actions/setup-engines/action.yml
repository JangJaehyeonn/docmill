name: Setup document engines
description: GridCraft·DeckCraft·WordCraft CLI(Linux x86_64)를 내려받아 PATH에 추가한다. 버전 고정, 릴리스의 SHA256SUMS로 확인.
runs:
  using: composite
  steps:
    - name: 엔진 내려받기
      shell: bash
      env:
        # 버전을 올릴 때는 Phase 0처럼 재현성·호환성을 다시 확인한다.
        ENGINES: "gridcraft@0.9.0 deckcraft@0.9.0 wordcraft@0.8.0"
      run: |
        set -euo pipefail
        root="$RUNNER_TOOL_CACHE/docmill-engines"
        mkdir -p "$root"
        for spec in $ENGINES; do
          name="${spec%@*}"; ver="${spec#*@}"
          dir="$root/$name-$ver"
          if [ ! -d "$dir" ]; then
            tmp=$(mktemp -d)
            base="https://github.com/storytold/$name/releases/download/v$ver"
            file="$name-$ver-linux-x86_64.tar.gz"
            curl -fsSL --retry 3 -o "$tmp/$file" "$base/$file"
            curl -fsSL --retry 3 -o "$tmp/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
            (cd "$tmp" && awk -v f="$file" '$2 == f || $2 == "*" f' SHA256SUMS.txt | sha256sum -c -)
            mkdir -p "$dir"
            tar -xzf "$tmp/$file" -C "$dir"
            rm -rf "$tmp"
          fi
          cli=$(find "$dir" -type f -name "$name-cli" | head -n1)
          if [ -z "$cli" ]; then
            echo "::error::$name-cli를 찾지 못했습니다 ($file)"
            exit 1
          fi
          chmod +x "$cli"
          dirname "$cli" >> "$GITHUB_PATH"
        done
    - name: 엔진 실행 확인
      shell: bash
      run: |
        gridcraft-cli version
        deckcraft-cli version
        wordcraft-cli --version
